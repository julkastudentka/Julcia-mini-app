<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Julcia</title>
  <style>
    :root {
      --bg: #fff5f8;
      --card: #ffffff;
      --text: #252126;
      --muted: #7d7178;
      --accent: #ff5f9e;
      --accent-dark: #e84687;
      --border: #f0dce5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", Roboto, Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px calc(28px + env(safe-area-inset-bottom));
    }

    .header {
      text-align: center;
      padding: 12px 8px 20px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff7db2, #ff4d94);
      color: white;
      font-size: 30px;
      box-shadow: 0 10px 25px rgba(255, 95, 158, .25);
    }

    h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .buttons {
      display: grid;
      gap: 11px;
    }

    .product {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      color: var(--text);
      padding: 16px 17px;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(70, 30, 50, .06);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .product:active {
      transform: scale(.985);
      box-shadow: 0 2px 8px rgba(70, 30, 50, .08);
    }

    .product span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin-top: 4px;
    }

    .menu {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 95, 158, .25);
    }

    .menu:active {
      background: var(--accent-dark);
      transform: scale(.985);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="logo">🩷</div>
      <h1>JULCIA</h1>
      <p class="subtitle">Wybierz interesującą Cię opcję</p>
    </header>

    <section class="buttons">

      <button class="product" onclick="openLink('pakiet5')">
        📸 Pakiet 5 fotek
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('pakiet2filmow')">
        🎥 Pakiet 2 filmików
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('pakiet38filmow')">
        🎥 Pakiet 38 filmików
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('pakiet1')">
        📦 Pakiet 1
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('pakiet2')">
        📦 Pakiet 2
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('pakiet3')">
        📦 Pakiet 3
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('pakiet200')">
        📸 Pakiet 200 fotek
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('pakiet20_10')">
        📸 Pakiet 20 fotek i 10 filmików
        <span>Otwórz pakiet</span>
      </button>

      <button class="product" onclick="openLink('informacje')">
        ℹ️ Informacje o Julcii
        <span>Przejdź do informacji</span>
      </button>

      <button class="product" onclick="openLink('probeczki')">
        🆓 Probeczki
        <span>Otwórz</span>
      </button>

    </section>

    <button class="menu" onclick="openLink('menu')">
      ☰ MENU
    </button>

    <div class="footer">
      Julcia
    </div>
  </main>

  <script>
    /*
      ==========================================================
      TUTAJ WKLEJ SWOJE LINKI
      ==========================================================
      Przykład:
      pakiet5: "https://t.me/....",

      Zostaw cudzysłowy i przecinek.
      Jeśli linku jeszcze nie masz, możesz zostawić "":
    */

    const links = {
      pakiet5: "",
      pakiet2filmow: "",
      pakiet38filmow: "",
      pakiet1: "",
      pakiet2: "",
      pakiet3: "",
      pakiet200: "",
      pakiet20_10: "",
      informacje: "",
      probeczki: "",
      menu: ""
    };

    function openLink(name) {
      const url = links[name];

      if (!url || url === "WKLEJ_TUTAJ_LINK") {
        alert("Link do tej opcji nie został jeszcze ustawiony.");
        return;
      }

      window.open(url, "_blank");
    }

    // Telegram Mini App: dopasowanie wyglądu do motywu Telegrama.
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
